name: Bug report
description: Report a reproducible problem in One Ministry.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include ministry member data, private media, credentials, or security-sensitive details. Report vulnerabilities using SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Numbered steps using synthetic data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: One Ministry version or commit
    validations:
      required: false
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment profile
      options:
        - Shared PHP hosting
        - Docker Compose
        - Other
    validations:
      required: true
