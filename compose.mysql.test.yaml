services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ministry_test
      MARIADB_USER: ministry
      MARIADB_PASSWORD: ministry-test-password
      MARIADB_ROOT_PASSWORD: root-test-password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./services/api
    volumes:
      - ./services/api:/var/www/html
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: ministry_test
      DB_USERNAME: ministry
      DB_PASSWORD: ministry-test-password
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
    depends_on:
      mariadb:
        condition: service_healthy
