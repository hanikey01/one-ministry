services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ministry
      POSTGRES_USER: ministry
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ministry -d ministry"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build: ./services/api
    command: ["sh", "-c", "rm -rf /var/www/html/public/build/* && cp -a /opt/ministry-build/. /var/www/html/public/build/ && exec php-fpm"]
    environment: &api_environment
      APP_NAME: Ministry Platform
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ministry
      DB_USERNAME: ministry
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Ministry Platform}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
      PLAYBACK_DIAGNOSTIC_RETENTION_DAYS: ${PLAYBACK_DIAGNOSTIC_RETENTION_DAYS:-7}
      LIVESTREAM_PROBE_REGIONS: ${LIVESTREAM_PROBE_REGIONS:-[]}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - public_build:/var/www/html/public/build

  worker:
    image: christianministry-api:latest
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=90"]
    environment: *api_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    image: christianministry-api:latest
    command: ["php", "artisan", "schedule:work"]
    environment: *api_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  proxy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/api/public:/var/www/html/public:ro
      - public_build:/var/www/html/public/build:ro
    depends_on:
      - api

  backup:
    profiles: ["ops"]
    build: ./infra/backup
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ministry
      PGDATABASE: ministry
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  public_build:
