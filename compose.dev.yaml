# Local development only. Combine with compose.yaml; do not use in production.
services:
  api:
    build:
      context: ./services/api
      args:
        INSTALL_REDIS_EXTENSION: "true"
    command: ["php-fpm"]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
    volumes:
      - ./services/api/app:/var/www/html/app
      - ./services/api/config:/var/www/html/config
      - ./services/api/database:/var/www/html/database
      - ./services/api/public:/var/www/html/public
      - ./services/api/resources:/var/www/html/resources
      - ./services/api/routes:/var/www/html/routes
      - ./services/api/artisan:/var/www/html/artisan:ro
      - public_build:/var/www/html/public/build

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/vite ]; then npm install --no-audit --no-fund --ignore-scripts; fi; exec npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    environment:
      # Use localhost by default. Set DEV_HOST to the computer's LAN address
      # when testing from a phone so the generated Vite asset and HMR URLs are reachable.
      VITE_DEV_ORIGIN: "http://${DEV_HOST:-localhost}:${DEV_PORT:-8080}"
      VITE_HMR_HOST: "${DEV_HOST:-localhost}"
      VITE_HMR_CLIENT_PORT: "${DEV_PORT:-8080}"
    volumes:
      - ./services/api:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
      - public_build:/var/www/html/public/build
    depends_on:
      - api

  proxy:
    volumes:
      - ./infra/Caddyfile.dev:/etc/caddy/Caddyfile:ro

volumes:
  vite_node_modules:

